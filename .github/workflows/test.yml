name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Sin dependencias: la batería usa el runner nativo de Node (node:test) y la lib zero-dep.
      - name: Run test battery
        run: npm test
